<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brainy Bunch - Classes</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <h1>Brainy Bunch Classes</h1>
    <div style="text-align: center; margin-bottom: 30px;">
        <button onclick="window.location.href='/record.html'" style="font-size: 1.1em; padding: 12px 24px;">🎤 Record New Session</button>
    </div>
    <div id="classes-container">Loading classes...</div>

    <script>
        async function fetchClasses() {
            try {
                const res = await fetch('/classes');
                const classes = await res.json();
                const container = document.getElementById('classes-container');
                container.innerHTML = '';

                for (const cls of classes) {
                    const card = document.createElement('div');
                    card.className = 'card';
                    
                    const title = document.createElement('h3');
                    title.textContent = `${cls.title} (${cls.subject})`;
                    
                    const dateP = document.createElement('p');
                    dateP.textContent = `Date: ${cls.date}`;
                    
                    // Fetch latest session for this class
                    const sessionRes = await fetch(`/sessions?class_id=${cls.id}`);
                    const sessions = await sessionRes.json();
                    
                    const actionsDiv = document.createElement('div');
                    
                    if (sessions.length > 0) {
                        const latestSession = sessions[0]; // Ordered by started_at desc, id desc in backend
                        const viewBtn = document.createElement('button');
                        viewBtn.textContent = 'View Study Session';
                        viewBtn.onclick = () => window.location.href = `/session.html?id=${latestSession.id}`;
                        actionsDiv.appendChild(viewBtn);
                    } else {
                        const noSession = document.createElement('span');
                        noSession.textContent = 'No sessions recorded. ';
                        actionsDiv.appendChild(noSession);
                    }

                    const calBtn = document.createElement('button');
                    calBtn.textContent = 'Add to Calendar';
                    calBtn.onclick = () => generateICS(cls.title, cls.date);
                    actionsDiv.appendChild(calBtn);

                    card.appendChild(title);
                    card.appendChild(dateP);
                    card.appendChild(actionsDiv);
                    container.appendChild(card);
                }
            } catch (err) {
                console.error(err);
                document.getElementById('classes-container').textContent = 'Error loading classes.';
            }
        }

        function generateICS(title, dateStr) {
            // Very simple ICS generator
            const dateParts = dateStr.split('-');
            if(dateParts.length !== 3) return alert('Invalid date');
            const yyyymmdd = dateParts.join('') + 'T090000Z'; // default 9am UTC
            
            const icsData = [
                'BEGIN:VCALENDAR',
                'VERSION:2.0',
                'BEGIN:VEVENT',
                `DTSTART:${yyyymmdd}`,
                `SUMMARY:${title}`,
                'END:VEVENT',
                'END:VCALENDAR'
            ].join('\n');

            const blob = new Blob([icsData], { type: 'text/calendar' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${title.replace(/\s+/g, '_')}.ics`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        fetchClasses();
    </script>
</body>
</html>
